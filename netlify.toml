# Netlify configuration for the Bluestem Advisory site, served at bluestem-advisory.com.
# Static site — no build step. Everything deployable lives in /site.

[build]
  publish = "site"
  # Netlify builds (and bills a deploy) on every push to main. Skip the deploy when
  # the push touched nothing that ships — README, scripts, content JSON that has
  # already been rendered into site/. Exit 0 = skip, 1 = build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/ netlify/ netlify.toml"

# The site's main address is bluestem-advisory.com (the principals' decision, 2026-10-05).
# Every other name the site answers on forwards there permanently, path and query kept, so
# old links, bookmarks and search rankings carry over. These rules must stay FIRST: Netlify
# applies the first rule that matches, and the clean-URL rules below would otherwise serve
# the old address its own copy. bluestemadvisoryllc.com stays the email domain (Google
# Workspace). bluestem-advisory.com itself reaches Netlify through Cloudflare's proxy.
[[redirects]]
  from = "https://bluestemadvisoryllc.com/*"
  to = "https://bluestem-advisory.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.bluestemadvisoryllc.com/*"
  to = "https://bluestem-advisory.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.bluestem-advisory.com/*"
  to = "https://bluestem-advisory.com/:splat"
  status = 301
  force = true

# Clean URL for the About page: /about works alongside /about.html
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

# Long-cache the image assets; HTML always revalidates
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Item 56 — the inquiry relay. Node functions; env vars are set in the Netlify UI.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/thanks"
  to = "/thanks.html"
  status = 200

# Item 57 — the self-assessment: clean URLs for the page and the three result pages.
[[redirects]]
  from = "/assessment"
  to = "/assessment.html"
  status = 200

[[redirects]]
  from = "/assessment/:band"
  to = "/assessment/:band.html"
  status = 200
