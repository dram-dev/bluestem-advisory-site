# Netlify configuration for bluestemadvisoryllc.com
# Static site — no build step. Everything deployable lives in /site.

[build]
  publish = "site"

# Clean URL for the About page: /about works alongside /about.html
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

# Long-cache the image assets; HTML always revalidates
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Item 56 — the inquiry relay. Node functions; env vars are set in the Netlify UI.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/thanks"
  to = "/thanks.html"
  status = 200

# Item 57 — the self-assessment: clean URLs for the page and the three result pages.
[[redirects]]
  from = "/assessment"
  to = "/assessment.html"
  status = 200

[[redirects]]
  from = "/assessment/:band"
  to = "/assessment/:band.html"
  status = 200
