# Netlify configuration for the Bluestem Advisory site, served at bluestem-advisory.com.
# Static site — no build step. Everything deployable lives in /site.

[build]
  publish = "site"
  # Netlify builds (and bills a deploy) on every push to main. Skip the deploy when
  # the push touched nothing that ships — README, scripts, content JSON that has
  # already been rendered into site/. Exit 0 = skip, 1 = build.
  # ALWAYS BUILD WHEN THERE IS NOTHING TO COMPARE. Without a build cache Netlify sets
  # CACHED_COMMIT_REF to COMMIT_REF itself, the diff is empty, and the build is
  # cancelled: "Canceled build due to no content change". The cache had expired after
  # six idle weeks, so on 2026-10-05 every push would have been cancelled, for good.
  ignore = '[ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- site/ netlify/ netlify.toml'

# The site's main address is bluestem-advisory.com (the principals' decision, 2026-10-05).
# Every other name the site answers on forwards there permanently, path and query kept, so
# old links, bookmarks and search rankings carry over. These rules must stay FIRST: Netlify
# applies the first rule that matches, and the clean-URL rules below would otherwise serve
# the old address its own copy. bluestemadvisoryllc.com stays the email domain (Google
# Workspace). bluestem-advisory.com itself reaches Netlify through Cloudflare's proxy.
[[redirects]]
  from = "https://bluestemadvisoryllc.com/*"
  to = "https://bluestem-advisory.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.bluestemadvisoryllc.com/*"
  to = "https://bluestem-advisory.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.bluestem-advisory.com/*"
  to = "https://bluestem-advisory.com/:splat"
  status = 301
  force = true

# Netlify's own default address served a full copy too. Deploy previews and branch deploys
# live on other hostnames (<id>--… and main--…), so this rule doesn't touch them.
[[redirects]]
  from = "https://stunning-trifle-b00895.netlify.app/*"
  to = "https://bluestem-advisory.com/:splat"
  status = 301
  force = true

# Clean URL for the About page: /about works alongside /about.html
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

# Hardening on every response (2026-10-05). None of it touches the pages' inline
# scripts and styles: the policy only says who may frame the site (no one), where its
# forms may post (here), what <base> may be, and that there are no plugins. HSTS comes
# from the edge already.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"

# Long-cache the image assets; HTML always revalidates
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Item 56 — the inquiry relay. Node functions; env vars are set in the Netlify UI.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/thanks"
  to = "/thanks.html"
  status = 200

# Item 57 — the self-assessment: clean URLs for the page and the three result pages.
[[redirects]]
  from = "/assessment"
  to = "/assessment.html"
  status = 200

[[redirects]]
  from = "/assessment/:band"
  to = "/assessment/:band.html"
  status = 200
